<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chromaflux</title>
<style>
/* Layout: full-bleed liquid stage; a quiet camera-monitor HUD hugs the corners and fades out when the pointer rests. */
:root{
  --stage:#05040b;
  --hud:#eef0ff;
  --hud-dim:rgba(238,240,255,.58);
  --hud-faint:rgba(238,240,255,.16);
  --hud-inv:#07060e;
  --glass:rgba(8,7,18,.42);
  --font-display:"Syncopate CF","Syncopate",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"Plex Mono CF","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body.paper{
  --hud:#141720;
  --hud-dim:rgba(20,23,32,.62);
  --hud-faint:rgba(20,23,32,.16);
  --hud-inv:#f4f6f8;
  --glass:rgba(255,255,255,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage)}
body{color:var(--hud);font-family:var(--font-mono);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;inset:0;pointer-events:none;transition:opacity .8s ease}
.hud p{margin:0}
body.idle .hud{opacity:0}
body.idle #gl{cursor:none}
body.render .hud{display:none}
.tl,.tr{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.tl{left:calc(20px + env(safe-area-inset-left,0px))}
.tr{right:calc(20px + env(safe-area-inset-right,0px));align-items:flex-end;text-align:right}
.mark{font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1;letter-spacing:.46em}
.meta{font-size:11px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--hud-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta b{font-weight:500;color:var(--hud)}
.bottom{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.left{display:flex;flex-direction:column;gap:10px;min-width:0}
.chapters{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chap{appearance:none;border:0;margin:0;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:9px;min-width:0;padding:10px 12px 12px;border-radius:3px;background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);color:var(--hud);font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;text-align:left;cursor:pointer;opacity:.62;transition:opacity .3s ease}
.chap:hover,.chap[aria-current="true"]{opacity:1}
.chap .sw{display:block;height:3px;width:100%;min-width:72px;border-radius:2px}
.chap .lb{display:flex;gap:8px;white-space:nowrap}
.chap .no{color:var(--hud-dim)}
.chap .pr{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--hud);opacity:.85}
.tools{display:flex;gap:6px;pointer-events:auto}
.btn{appearance:none;border:0;margin:0;min-width:40px;height:40px;padding:0 11px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:3px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--hud);font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .25s ease,color .25s ease}
.btn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{background:var(--hud);color:var(--hud-inv)}
.chap:focus-visible,.btn:focus-visible{outline:1px solid var(--hud);outline-offset:3px}
.hint{font-size:11px;line-height:1.5;letter-spacing:.06em;color:var(--hud-dim)}
.hint b{font-weight:500;color:var(--hud)}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px;line-height:1.6;color:var(--hud)}
@media (max-width:760px){.chap .nm{display:none}.chap .sw{min-width:44px}.hint{display:none}.btn .lbl{display:none}}
@media (max-width:420px){.tl,.tr{top:calc(14px + env(safe-area-inset-top,0px))}.tl{left:16px}.tr{right:16px}.bottom{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}.mark{font-size:11px}.btn{min-width:36px;height:36px;padding:0 9px}.chap{padding:9px 9px 11px}.chap .sw{min-width:30px}}
.gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding-block:24px;padding-inline:16px;background:radial-gradient(120% 90% at 50% 45%,rgba(5,4,11,.30),rgba(5,4,11,.88));-webkit-backdrop-filter:blur(3px) saturate(1.1);backdrop-filter:blur(3px) saturate(1.1);color:var(--hud);cursor:pointer;transition:opacity .9s ease}
.gate.out{opacity:0;pointer-events:none}
.gate-inner{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:36rem;text-align:center}
.gate p{margin:0}
.gate-kicker{font-size:11px;line-height:1.6;letter-spacing:.22em;text-transform:uppercase;color:var(--hud-dim);text-wrap:balance}
.gate-title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(24px,6.4vw,64px);line-height:1;letter-spacing:.42em;margin-right:-.42em;text-wrap:balance}
.gate-play{appearance:none;border:0;margin-top:6px;display:flex;align-items:center;gap:12px;padding:16px 26px 16px 20px;border-radius:999px;background:var(--hud);color:var(--hud-inv);font:500 13px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;animation:halo 2.4s ease-out infinite}
.gate-play svg{width:20px;height:20px;fill:currentColor}
.gate-alt{appearance:none;border:0;background:none;padding:8px;color:var(--hud-dim);font:400 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.gate-status{max-width:30rem;padding:12px 14px;border-radius:3px;background:var(--glass);font-size:12px;line-height:1.55;letter-spacing:.02em;color:var(--hud);text-wrap:pretty}
.gate-note{font-size:11px;line-height:1.6;letter-spacing:.08em;color:var(--hud-dim);text-wrap:balance}
.gate-play:focus-visible,.gate-alt:focus-visible{outline:1px solid var(--hud);outline-offset:4px}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(238,240,255,.45)}70%{box-shadow:0 0 0 18px rgba(238,240,255,0)}100%{box-shadow:0 0 0 0 rgba(238,240,255,0)}}
.level{width:34px;height:34px;border-radius:50%;border:1px solid var(--hud-faint);position:relative;margin-top:2px}
.level::before,.level::after{content:"";position:absolute;background:var(--hud-faint)}
.level::before{left:50%;top:4px;bottom:4px;width:1px}
.level::after{top:50%;left:4px;right:4px;height:1px}
.level i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--hud);box-shadow:0 0 8px var(--hud)}
.toast{position:fixed;z-index:6;left:50%;top:calc(50% - 40px);transform:translate(-50%,-50%);width:min(30rem,calc(100% - 32px));padding:14px 18px;border-radius:3px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--hud);font:400 13px/1.55 var(--font-mono);letter-spacing:.02em;text-align:center;text-wrap:pretty;pointer-events:none;transition:opacity .6s ease}
.toast.fade{opacity:0}
body.hold #gl{cursor:default}
body.gated .hud{display:none}
body.render .gate{display:none}
@media (prefers-reduced-motion:reduce){.hud,.chap,.btn,.gate{transition:none}.gate-play{animation:none}}
</style>

<canvas id="gl" aria-label="Interaktive Flüssigkeitssimulation: ziehen zum Rühren, tippen für eine Farbexplosion"></canvas>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-inner">
    <p class="gate-kicker">Eine Studie in flüssigem Licht · 80 Sekunden · 5 Kapitel</p>

    <button class="gate-play" id="bStart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg><span>Starten · mit Ton</span></button>
    <button class="gate-alt" id="bStartMute" type="button">Ohne Ton starten</button>
    <button class="gate-alt" id="bStartHold" type="button">Im Halte-Modus starten</button>
    <button class="gate-alt" id="bHapticTest" type="button" hidden>Vibration testen</button>
    <p class="gate-status" id="hapticStatus" role="status" hidden></p>
    <p class="gate-note">Kopfhörer empfohlen · enthält Lichtblitze<br>Ziehen rührt die Flüssigkeit, Tippen zündet Farbe</p>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="hud" id="hud">
  <div class="tl">
    <p class="mark">CHROMAFLUX</p>
    <p class="meta" id="chapLine"><b>01 / 05</b> · Neon Iris</p>
  </div>
  <div class="tr">
    <p class="meta" id="tc">TC 00:00:00</p>
    <p class="meta" id="fps">— FPS</p>
    <div class="level" id="level" aria-hidden="true" hidden><i></i></div>
  </div>
  <div class="bottom">

      <div class="chapters" id="chapters" role="group" aria-label="Kapitel"></div>
      <p class="hint" id="hint"><b>Ziehen</b> rühren · <b>Tippen</b> Explosion · <b>Leertaste</b> Flash · <b>1–5</b> Kapitel · <b>M</b> Ton</p>

    <div class="tools">
      <button class="btn" id="bSound" type="button" aria-pressed="false" aria-label="Ton einschalten (M)" title="Ton (M)"></button>
      <button class="btn" id="bAuto" type="button" aria-pressed="true" aria-label="Autopilot (A)" title="Autopilot: Regie-Modus mit Kapiteln (A)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg></button>
      <button class="btn" id="bHold" type="button" aria-pressed="false" aria-label="Halte-Modus: per Handylage steuern (G)" title="Halte-Modus: per Handylage steuern (G)"><svg viewBox="0 0 24 24"><rect x="8.5" y="4" width="9" height="15" rx="2" transform="rotate(-20 13 11.5)"/><path d="M3.5 15.5c.6 2.3 2.4 4.1 4.7 4.8"/><path d="M8.6 18.2l-.4 2.1 2.1.4"/></svg><span class="lbl">Halten</span></button>
      <button class="btn" id="bHaptic" type="button" aria-pressed="true" aria-label="Vibration (V)" title="Vibration (V)" hidden><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4.5 8.5v7M19.5 8.5v7M1.5 10.5v3M22.5 10.5v3"/></svg></button>
      <button class="btn" id="bFlash" type="button" aria-label="Flash auslösen (Leertaste)" title="Flash (Leertaste)"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="btn" id="bFull" type="button" aria-label="Vollbild (F)" title="Vollbild (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn" id="bHide" type="button" aria-label="Oberfläche ausblenden (H)" title="Oberfläche ausblenden (H)"><svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 3.9M6.6 6.6C3.9 8.4 2.5 12 2.5 12s3.5 7 9.5 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ================================================================
   CHROMAFLUX — real-time liquid light.
   Stable-fluids solver (MacCormack dye advection, vorticity
   confinement), studio-lit shading, HDR bloom, light shafts,
   anamorphic streaks, mica particles, a directed timeline and a
   generative WebAudio score. ?render=1 drives a deterministic
   offline render (see render/render.mjs).
   ================================================================ */

const QS = new URLSearchParams(location.search);
const RENDER = QS.get('render') === '1';
const OPT = {
  w: +QS.get('w') || 1920, h: +QS.get('h') || 1080, fps: +QS.get('fps') || 60,
  dye: +QS.get('dye') || 0, sim: +QS.get('sim') || 0, parts: +QS.get('parts') || 0,
  every: +QS.get('every') || 1, from: +QS.get('from') || 0,
  to: QS.has('to') ? +QS.get('to') : null, mode: QS.get('mode') || 'raw', start: +QS.get('start') || 0,
  chunk: +QS.get('chunk') || 0, resume: QS.get('resume') === '1'
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches && !RENDER;
const COARSE = matchMedia('(pointer: coarse)').matches;
const TAU = Math.PI * 2;
if (RENDER) document.body.classList.add('render'); else document.body.classList.add('gated');

/* ---------- small math ---------- */
function mulberry32(a) {   // state lives on .s so offline renders can checkpoint it
  const f = function () { let t = f.s = (f.s + 0x6D2B79F5) | 0; t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.s = a | 0; return f;
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const lin = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2)); };
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---------- palettes ---------- */
const PAL = [
  { name: 'Neon Iris', short: 'Neon', hex: ['#00E5FF', '#1F6BFF', '#7B2CFF', '#FF1FCF', '#FFC23D'],
    r: { ink: 0, metal: 0.05, irid: 0.7, spec: 1.1, bloom: 1.4, thr: 0.55, rays: 0.22, streak: 0.25, part: 1.0, expo: 1.7, bump: 0.012, refr: 0.004, ca: 0.6, grain: 0.030, glow: 1.25, vig: 0.55,
         bgTop: '#0c0a24', bgBot: '#020108', accent: '#7fd8ff' },
    sim: { vort: 9, buoy: 0, swirl: 0.05 }, chord: [38, 57, 62, 65, 69, 76], scale: [74, 77, 79, 81, 84, 86, 89] },
  { name: 'Tinte im Wasser', short: 'Tinte', hex: ['#2F5BFF', '#FF1E3C', '#FFB000', '#00C2A8', '#9B3DFF'],
    r: { ink: 1, metal: 0, irid: 0, spec: 0.25, bloom: 0, thr: 2.0, rays: 0, streak: 0, part: 0, expo: 1.0, bump: 0.008, refr: 0.008, ca: 0.35, grain: 0.018, glow: 0.8, vig: 0.22,
         bgTop: '#F6F8FA', bgBot: '#DCE3E9', accent: '#ffffff' },
    sim: { vort: 7, buoy: -0.45, swirl: 0, dyeDiss: 0.03, noise: 0.03 }, chord: [41, 60, 64, 67, 69, 76], scale: [72, 76, 77, 79, 81, 84] },
  { name: 'Gold & Lava', short: 'Lava', hex: ['#FFB31A', '#FF7A1A', '#FF3D00', '#FFE08A', '#B01E05'],
    r: { ink: 0, metal: 1, irid: 0.2, spec: 2.2, bloom: 1.3, thr: 0.7, rays: 0.16, streak: 0.45, part: 1.1, expo: 1.6, bump: 0.032, refr: 0.004, ca: 0.5, grain: 0.030, glow: 1.2, vig: 0.6,
         bgTop: '#1a0e07', bgBot: '#040101', accent: '#ffb347' },
    sim: { vort: 8, buoy: 0.32, swirl: 0.03, dyeDiss: 0.18 }, chord: [26, 38, 45, 50, 53, 57], scale: [62, 65, 69, 72, 74] },
  { name: 'Aurora', short: 'Aurora', hex: ['#00D1B2', '#3DFF8F', '#8A3CFF', '#6FE7FF', '#FF5FA2'],
    r: { ink: 0, metal: 0.15, irid: 0.6, spec: 0.9, bloom: 1.5, thr: 0.5, rays: 0.3, streak: 0.2, part: 1.3, expo: 1.7, bump: 0.011, refr: 0.004, ca: 0.6, grain: 0.030, glow: 1.3, vig: 0.55,
         bgTop: '#04131f', bgBot: '#010309', accent: '#7dffd9' },
    sim: { vort: 12, buoy: 0, swirl: 0, shear: 0.2, dyeDiss: 0.2 }, chord: [41, 57, 64, 67, 69, 72], scale: [77, 79, 81, 84, 86, 88] },
  { name: 'Prisma', short: 'Prisma', hex: ['#FF2D55', '#FF9F0A', '#FFE620', '#30D158', '#40C8E0', '#0A84FF', '#BF5AF2'],
    r: { ink: 0, metal: 0.1, irid: 0.8, spec: 1.2, bloom: 1.4, thr: 0.55, rays: 0.35, streak: 0.3, part: 1.25, expo: 1.7, bump: 0.012, refr: 0.004, ca: 0.6, grain: 0.030, glow: 1.25, vig: 0.55,
         bgTop: '#0a0812', bgBot: '#010103', accent: '#ffffff' },
    sim: { vort: 9, buoy: 0, swirl: 0.06 }, chord: [38, 54, 57, 61, 64, 69], scale: [74, 76, 78, 81, 83, 86] }
];
const RKEYS = ['ink', 'metal', 'irid', 'spec', 'bloom', 'thr', 'rays', 'streak', 'part', 'expo', 'bump', 'refr', 'ca', 'grain', 'glow', 'vig'];
const VKEYS = ['bgTop', 'bgBot', 'accent'];
PAL.forEach(p => { p.colors = p.hex.map(lin); VKEYS.forEach(k => { p.r[k] = lin(p.r[k]); }); });

const SIM_BASE = { vort: 8, gx: 0, buoy: 0, shear: 0, shearW: 0.07, shearRate: 1.0, swirl: 0, velDiss: 0.35, dyeDiss: 0.3, maxV: 3.0, noise: 0.06, noiseS: 1.6 };
const sim = Object.assign({}, SIM_BASE);
const RP = {};
let targetPal = 0, palTau = 0.6;
function setPal(i, tau) { targetPal = i; palTau = tau; }
function snapPal(i) { targetPal = i; const r = PAL[i].r; RKEYS.forEach(k => { RP[k] = r[k]; }); VKEYS.forEach(k => { RP[k] = r[k].slice(); }); }
snapPal(0);
function updateRP(dt) {
  const r = PAL[targetPal].r, k = 1 - Math.exp(-dt / Math.max(palTau, 1e-3));
  RKEYS.forEach(key => { RP[key] += (r[key] - RP[key]) * k; });
  VKEYS.forEach(key => { for (let j = 0; j < 3; j++) RP[key][j] += (r[key][j] - RP[key][j]) * k; });
}

/* ================================================================
   WebGL
   ================================================================ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: RENDER, powerPreference: 'high-performance' });
if (!gl) {
  document.getElementById('hud').hidden = true;
  const f = document.createElement('div'); f.className = 'fallback';
  f.textContent = 'Dein Browser stellt kein WebGL2 bereit. Probier es mit einem aktuellen Chrome, Edge, Firefox oder Safari.';
  document.body.appendChild(f); return;
}
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
const LINF = gl.getExtension('OES_texture_float_linear');
const FBLEND = gl.getExtension('EXT_float_blend');

function canRender(internal, format, type) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, type, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);
  return ok;
}
const HAS16 = canRender(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
const HAS32 = canRender(gl.RGBA32F, gl.RGBA, gl.FLOAT) && !!FBLEND;
// Offline renders use fp32: SwiftShader converts half floats in software and runs ~2x slower on them.
const F32 = { i: gl.RGBA32F, f: gl.RGBA, t: gl.FLOAT }, F16 = { i: gl.RGBA16F, f: gl.RGBA, t: gl.HALF_FLOAT };
const FMT = (RENDER && HAS32 && LINF) ? F32 : HAS16 ? F16 : (HAS32 && LINF) ? F32 : { i: gl.RGBA8, f: gl.RGBA, t: gl.UNSIGNED_BYTE };
const PFMT = canRender(gl.RGBA32F, gl.RGBA, gl.FLOAT) ? F32 : HAS16 ? F16 : null;
const FILT = (FMT.t === gl.FLOAT && !LINF) ? gl.NEAREST : gl.LINEAR;

/* ---------- shaders ---------- */
const HDR = '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n';
const VS = HDR + `
uniform vec2 uTexel;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  vL = vUv - vec2(uTexel.x, 0.0); vR = vUv + vec2(uTexel.x, 0.0);
  vT = vUv + vec2(0.0, uTexel.y); vB = vUv - vec2(0.0, uTexel.y);

/* ---------- program plumbing ---------- */
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error('shader: ' + log);
  }
  return s;
}
function program(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return { p, u, use() { gl.useProgram(p); return this; } };

/* ---------- quality tiers ---------- */
const TIERS = [

    w = Math.max(2, Math.round(canvas.clientWidth * dpr)); h = Math.max(2, Math.round(canvas.clientHeight * dpr));
    const k = Math.sqrt(Math.min(1, TIERS[tier].px / (w * h)));

/* ---------- camera & effects state ---------- */
const FX = { flash: 0, white: 0, fxy: [0.5, 0.5], tint: [1, 1, 1], punch: 0, fade: 1, title: 0, zoom: 1.04, ox: 0, oy: 0 };

  FX.zoom = (Hold.on ? 1.012 + 0.004 * Math.sin(t * 0.13) : 1.045 + 0.018 * Math.sin(t * 0.13)) + FX.punch;
  FX.ox = 0.006 * Math.sin(t * 0.071) + FX.punch * 0.22 * Math.sin(t * 47.0);

/* ---------- render ---------- */

  f1(p, 'uInk', RP.ink); f1(p, 'uMetal', RP.metal); f1(p, 'uIrid', RP.irid); f1(p, 'uSpec', RP.spec);
  f1(p, 'uBump', RP.bump); f1(p, 'uRefr', RP.refr); f1(p, 'uGlow', RP.glow);

const T_TOTAL = 80;

    await fetch('/ckpt/' + k + '.bin?next=' + next, { method: 'POST', body: a });

  await fetch('/ckpt/state.json?next=' + next, { method: 'POST', body: JSON.stringify(st) });
}

/* deterministic offline render: frames are POSTed to the local render server */
async function runRender() {
  await fontsReady();
  fitCanvas(); build();
  const fps = OPT.fps, dt = 1 / fps;
  const end = OPT.to != null ? OPT.to : T_TOTAL;
  const N = Math.round(end * fps), F0 = Math.round(OPT.from * fps);
  const W = canvas.width, H = canvas.height, px = new Uint8Array(W * H * 4);
  const log = m => fetch('/log', { method: 'POST', body: m });
  await log('render ' + W + 'x' + H + ' dye ' + dye.w + 'x' + dye.h + ' sim ' + vel.w + 'x' + vel.h + ' particles ' + pcount + ' frames ' + N);
  let S0 = Math.round(OPT.start * fps);
  dirSeek(S0 * dt);
  if (OPT.start > 0) { const ci = chapterAt(OPT.start); if (ci >= 0) snapPal(CHAPTERS[ci].pal); }
  if (OPT.resume) { S0 = await loadCkpt(); await log('resumed at frame ' + S0); }
  const t0 = performance.now();
  for (let f = S0; f < N; f++) {
    const t = f * dt;
    dirUpdate(t, dt); fxUpdate(t, dt); updateRP(dt); step(dt, t);
    if (f >= F0 && (f - F0) % OPT.every === 0) {
      render(t);
      if (OPT.mode === 'png') {
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await fetch('/still?f=' + f + '&t=' + t.toFixed(2), { method: 'POST', body: blob });
      } else {
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
        await fetch('/frame?f=' + f, { method: 'POST', body: px });
      }
    } else if (f % 8 === 0) gl.flush();
    if (OPT.chunk && (f + 1) % OPT.chunk === 0 && f + 1 < N) await saveCkpt(f + 1);
    if (f === Math.max(F0, S0)) { const err = gl.getError(); if (err) await log('GL ERROR 0x' + err.toString(16)); }
    if (f % 120 === 0) await log('frame ' + f + '/' + N + ' ' + ((performance.now() - t0) / 1000).toFixed(1) + 's');
  }
  await fetch('/done', { method: 'POST', body: 'ok' });
}

  for (let f = Math.round(t0 * 60); f < Math.round(t1 * 60); f++) {
    const t = f * dt; dirUpdate(t, dt); fxUpdate(t, dt); updateRP(dt); step(dt, t);
    if (f % every === 0) { render(t); out.push({ t: +t.toFixed(2), vel: stats(vel.read), dye: stats(dye.read), hdr: stats(hdr), bloom: stats(bloom[0]), pres: stats(pres.read).max[0] }); }
  }

}

else bootLive().catch(err => { console.error(err); });
