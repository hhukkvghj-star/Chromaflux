name: Android-App

# Every change to the page or the app builds a fresh APK and publishes it as the latest release:
# https://github.com/hhukkvghj-star/Chromaflux/releases/latest/download/Chromaflux.apk
on:
  push:
    branches: [main]
    paths: [index.html, 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle the page into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build the APK
        run: gradle -p android :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk Chromaflux.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Chromaflux App 1.0.${{ github.run_number }}
          make_latest: true
          files: Chromaflux.apk
          body: |
            **Installieren:** `Chromaflux.apk` am Handy antippen. Beim ersten Mal fragt Android, ob dein Browser bzw. Datei-Manager Apps installieren darf – einmal erlauben.

            Neue Versionen installieren sich einfach über die alte. Gebaut aus `${{ github.sha }}`.
